<!DOCTYPE html>
<html lang="pt-br"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo de Audiobook</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Audiobook Player</h1>
        <div class="audiobook-info">
            <img id="cover" src="cover.jpg" alt="Capa do Audiobook">
            <h2 id="title">Título do Audiobook</h2>
            <h3 id="author">Autor do Audiobook</h3>
        </div>
        <audio id="audio" controls>
            <source src="audiobook.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>
        <div class="controls">
            <button id="play-pause">Play/Pause</button>
            <button id="stop">Stop</button>
            <input type="range" id="seek-bar" value="0" max="100">
            <span id="current-time">00:00</span> / <span id="duration">00:00</span>
        </div>
    </div>
</html>
